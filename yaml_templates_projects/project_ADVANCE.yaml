project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "ADVANCE"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "AI-Driven Valuation and Novel Creation of Energy-efficient, Low-Dimensional, High-Entropy Alloys with Superior Catalytic Performance for Hydrogen Production"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    description: >
    La production d’hydrogène bas-carbone par électrolyse de l’eau nécessite
    des électrocatalyseurs efficaces, stables et moins dépendants des métaux
    nobles. La réaction d’évolution de l’hydrogène (HER) constitue à ce titre
    une étape clé. Les alliages multicomposants, notamment les alliages à haute
    entropie de faible dimensionnalité (LD-HEA), offrent un vaste espace de
    composition pour ajuster les environnements atomiques locaux et les
    performances catalytiques.
    Le projet ADVANCE vise à accélérer la découverte de nouveaux
    électrocatalyseurs pour la HER en combinant intelligence artificielle,
    science des données et expérimentation. Des modèles d’apprentissage
    automatique relient composition et performances tout en quantifiant
    l’incertitude des prédictions. Une stratégie d’apprentissage actif
    (active learning) guide ensuite la sélection des compositions à tester
    en conciliant performance prédite, incertitude et diversité chimique.
    Les compositions sélectionnées sont synthétisées, caractérisées et
    évaluées expérimentalement. Les nouvelles données alimentent à leur tour
    les modèles, constituant une boucle itérative IA–expérience destinée à
    explorer efficacement l’espace de composition et à accélérer la découverte
    de nouveaux électrocatalyseurs pour la production d’hydrogène.
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/advance/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional

